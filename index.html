
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GET THE $$$$ | League Headquarters</title>
  <style>

    <div class="cards">
      <div class="card">
        <h3>2026 Standings</h3>
        <p><a href="./standings.html">View 2026 standings</a></p>
      </div>
      <div class="card">
        <h3>Season History</h3>
        <p>2021–2026</p>
      </div>
      <div class="card">
        <h3>Manager Profiles</h3>

</html>
